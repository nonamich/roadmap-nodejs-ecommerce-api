syntax = "proto3";

package payments;

enum PaymentStatus {
  canceled = 0;
  processing = 1;
  requires_action = 2;
  requires_capture = 3;
  requires_confirmation = 4;
  requires_payment_method = 5;
  succeeded = 6;
}

message CreateIntentRequest {
  int32 amountInCent = 1;
}

message CreateResponse {
  string intentId = 1;
}

message GetIntentRequest {
  string intentId = 1;
}

message GetIntentResponse {
  string id = 1;
  string clientSecret = 2;
  int32 amount = 3;
  PaymentStatus status = 4;
  string currency = 5;
}

service PaymentsService {
  rpc createIntent(CreateIntentRequest) returns (CreateResponse);
  rpc getIntent(GetIntentRequest) returns (GetIntentResponse);
}
