syntax = "proto3";

package user;

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message GetUserByCredentialsRequest {
  string email = 1;
  string password = 2;
}

service UserService {
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc GetUserByCredentials(GetUserByCredentialsRequest) returns (UserResponse);
}

message UserResponse {
  string id = 1;
  string name = 2;
  string email = 3;
}
