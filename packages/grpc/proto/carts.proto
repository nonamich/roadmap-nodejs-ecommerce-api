syntax = "proto3";

package carts;

import "products.proto";

message CartItemResponse {
  int32 quantity = 1;
  products.Product product = 2;
}

message CartResponse {
  repeated CartItemResponse items = 1;
  int32 totalQuantity = 2;
  int32 totalPrice = 3;
}

message GetCartRequest {
  int32 userId = 1;
}

message AddToCartRequest {
  int32 productId = 1;
  int32 quantity = 2;
  int32 userId = 3;
}

message UpdateQuantityRequest {
  int32 productId = 1;
  int32 quantity = 2;
  int32 userId = 3;
}

message RemoveFromCartRequest {
  int32 userId = 1;
  int32 productId = 2;
}

service CartsService {
  rpc AddToCart(AddToCartRequest) returns (CartResponse);
  rpc GetCart(GetCartRequest) returns (CartResponse);
  rpc UpdateQuantity(UpdateQuantityRequest) returns (CartResponse);
  rpc RemoveFromCart(RemoveFromCartRequest) returns (CartResponse);
}
