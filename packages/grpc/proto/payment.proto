syntax = "proto3";

package payment;

enum PaymentStatus {
  canceled = 0;
  processing = 1;
  requires_action = 2;
  requires_capture = 3;
  requires_confirmation = 4;
  requires_payment_method = 5;
  succeeded = 6;
}

message CreateIntentRequest {
  int32 amountInCent = 1;
}

message GetIntentRequest {
  string intentId = 1;
}

service PaymentService {
  rpc CreateIntent(CreateIntentRequest) returns (IntentResponse);
  rpc GetIntent(GetIntentRequest) returns (IntentResponse);
}

message IntentResponse {
  string id = 1;
  int32 amount = 2;
  string currency = 3;
  string clientSecret = 4;
  PaymentStatus status = 5;
}
