syntax = "proto3";

package product;

import "google/protobuf/timestamp.proto";

message CategoryResponse {
  string id = 1;
  string slug = 2;
  string name = 3;
}

message BrandResponse {
  string id = 1;
  string slug = 2;
  string name = 3;
}

message ProductResponse {
  string id = 1;
  int32 amount = 2;
  string image = 4;
  double price = 5;
  string title = 6;
  string slug = 7;
  string description = 8;
  optional double rating = 9;
  google.protobuf.Timestamp createdAt = 10;
  BrandResponse brand = 11;
  CategoryResponse category = 12;
}

message GetProductByIdRequest {
  string id = 1;
}

message GetProductBySlugRequest {
  string slug = 1;
}

message GetProductsByIdsRequest {
  repeated string ids = 1;
}

message GetProductsPaginationRequest {
  int32 page = 1;
  int32 limit = 2;
}

message GetFeaturedProductsRequest {
  GetProductsPaginationRequest pagination = 1;
}

message GetProductsByFilterRequest {
  optional string brandSlug = 1;
  optional string categorySlug = 2;
  GetProductsPaginationRequest pagination = 3;
}

service ProductService {
  rpc GetProductBySlug(GetProductBySlugRequest) returns (ProductResponse);
  rpc GetProductById(GetProductByIdRequest) returns (ProductResponse);
  rpc GetProductsByIds(GetProductsByIdsRequest) returns (stream ProductResponse);
  rpc GetProductsByFilter(GetProductsByFilterRequest) returns (ProductsResponse);
  rpc GetFeaturedProducts(GetFeaturedProductsRequest) returns (ProductsResponse);
}

message PaginationResponse {
  int32 page = 1;
  int32 limit = 2;
  int32 totalCount = 3;
}

message ProductsResponse {
  repeated ProductResponse products = 1;
  PaginationResponse pagination = 2;
}
