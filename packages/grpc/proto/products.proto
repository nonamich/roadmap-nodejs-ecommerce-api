syntax = "proto3";

package products;

import "google/protobuf/timestamp.proto";

message CategoryResponse {
  int32 id = 1;
  string name = 2;
}

message BrandResponse {
  int32 id = 1;
  string name = 2;
}

message ProductResponse {
  int32 id = 1;
  int32 amount = 2;
  string image = 4;
  double price = 5;
  string title = 6;
  string description = 7;
  optional double rating = 8;
  google.protobuf.Timestamp createdAt = 9;
  BrandResponse brand = 10;
  CategoryResponse category = 11;
}

message GetProductByIdRequest {
  int32 id = 1;
}

message GetProductsByIdsRequest {
  repeated int32 ids = 1;
}

message GetProductsPaginationRequest {
  int32 page = 1;
  int32 limit = 2;
}

message GetFeaturedProductsRequest {
  GetProductsPaginationRequest pagination = 1;
}

message GetProductsByFilterRequest {
  optional int32 brandId = 1;
  optional int32 categoryId = 2;
  GetProductsPaginationRequest pagination = 3;
}

service ProductsService {
  rpc GetProductById(GetProductByIdRequest) returns (ProductResponse);
  rpc GetProductsByIds(GetProductsByIdsRequest) returns (stream ProductResponse);
  rpc GetProductsByFilter(GetProductsByFilterRequest) returns (ProductsResponse);
  rpc GetFeaturedProducts(GetFeaturedProductsRequest) returns (ProductsResponse);
}

message PaginationResponse {
  int32 page = 1;
  int32 limit = 2;
  int32 totalCount = 3;
}

message ProductsResponse {
  repeated ProductResponse products = 1;
  PaginationResponse pagination = 2;
}
