syntax = "proto3";

package products;

import "google/protobuf/timestamp.proto";

message Category {
  int32 id = 1;
  string name = 2;
}

message Brand {
  int32 id = 1;
  string name = 2;
}

message Product {
  int32 id = 1;
  int32 amount = 2;
  string currency = 3;
  string image = 4;
  int32 price = 5;
  string title = 6;
  optional float rating = 7;

  google.protobuf.Timestamp createdAt = 8;
  Brand brand = 9;
  Category category = 10;
}

message Image {
  bytes buffer = 1;
  int64 size = 2;
  string mimetype = 3;
  string encoding = 4;
}

message CreateProductRequest {
  int32 amount = 1;
  int32 brandId = 2;
  int32 categoryId = 3;
  int32 currency = 4;
  int32 price = 5;
  string title = 6;
  Image image = 7;
}

message GetProductByIdRequest {
  int32 id = 1;
}

// enum ProductSortDirection {
//   ASC = 0;
//   DESC = 1;
// }

// enum ProductSortBy {
//   CREATED_AT = 0;
//   RATING = 1;
//   PRICE = 2;
// }

message GetProductsByFilterRequest {
  optional int32 categoryId = 1;
  optional int32 brandId = 2;
  // optional ProductSortDirection sortDirection = 3;
  // optional ProductSortBy sortBy = 4;
}

message UpdateProductRequest {
  int32 id = 1;
  optional int32 amount = 2;
  optional string currency = 3;
  optional string image = 4;
  optional int32 price = 5;
  optional float rating = 6;
  optional string title = 7;
}

service ProductsService {
  rpc GetProductById(GetProductByIdRequest) returns (Product);
  rpc GetProductsByFilter(GetProductsByFilterRequest) returns (stream Product);
}
