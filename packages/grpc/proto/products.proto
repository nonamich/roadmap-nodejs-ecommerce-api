syntax = "proto3";

package products;

import "google/protobuf/timestamp.proto";

// Models

message Category {
  int32 id = 1;
  string name = 2;
}

message Brand {
  int32 id = 1;
  string name = 2;
}

message Product {
  int32 id = 1;
  int32 amount = 2;
  string currency = 3;
  string image = 4;
  int32 price = 5;
  string title = 6;
  string description = 7;
  optional float rating = 8;
  google.protobuf.Timestamp createdAt = 9;
  Brand brand = 10;
  Category category = 11;
}

// Requests

message GetProductByIdRequest {
  int32 id = 1;
}

message PaginationRequest {
  int32 page = 1;
  int32 limit = 2;
}

message GetFeaturedProductsRequest {
  PaginationRequest pagination = 1;
}

message GetProductsByFilterRequest {
  optional int32 brandId = 1;
  optional int32 categoryId = 2;
  PaginationRequest pagination = 3;
}

// Responses

message PaginationResponse {
  int32 totalCount = 1;
}

message ProductsResponse {
  repeated Product products = 1;
  PaginationResponse pagination = 2;
}

service ProductsService {
  rpc GetProductById(GetProductByIdRequest) returns (Product);
  rpc GetProductsByFilter(GetProductsByFilterRequest) returns (ProductsResponse);
  rpc GetFeaturedProducts(GetFeaturedProductsRequest) returns (ProductsResponse);
}
